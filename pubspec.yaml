name: pooldose_orp_controller
description: "PoolDose & NOVA-M ORP Pro Pool Water Chemistry Controller App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.1.0
  provider: ^6.0.5
  go_router: ^12.1.3
  intl: ^0.20.3
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  flutter_barcode_scanner: ^2.0.0
  flutter_animate: ^4.5.0
  fl_chart: ^0.66.0
  font_awesome_flutter: ^10.6.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
